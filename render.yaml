# Render Blueprint for AutoMaintainer. See docs/DEPLOYMENT.md.
#
# Topology:
#   automaintainer-backend             web     uvicorn API + Celery `agent_runs`
#                                              worker in ONE container
#   automaintainer-celery-maintenance  worker  Celery `maintenance,github_sync`
#                                              + embedded beat
#   automaintainer-redis               redis   broker / result backend / locks
#
# REDIS_URL comes from `fromService ... property: connectionString`, the
# Key Value internal URL (render.com/docs/blueprint-spec; the JSON schema at
# render.com/schema/render.yaml.json allows host, port, hostport, slug and
# connectionString for fromService). Any other property leaves REDIS_URL
# unset, celery_app.py falls back to localhost, the API and workers never
# share a broker and every /start answers 503. `type: redis` is Render's
# deprecated alias for `keyvalue`; it is kept because a service's type cannot
# be changed after creation, and renaming it is not needed for correctness.
#
# Why the API and the agent worker share a service: the worker clones target
# repositories into AUTOMAINTAINER_WORKSPACE_DIR and the API's IDE routes
# (/repo/.../tree, /file, /search) and terminal read those clones from local
# disk. Render persistent disks are attached to exactly one service and cannot
# be shared, so separate API and worker services would never see each other's
# clones (IDE routes return 404). Running both processes in one container is
# the simplest correct option. Consequences:
#   - the backend service must stay at ONE instance (each instance has its own
#     filesystem), so it has no autoscaling block;
#   - clones live on the container's ephemeral filesystem and are re-cloned
#     after a deploy/restart, which the agent already does on demand.
#
# All services build the repo Dockerfile so gitnexus/Node and git are present
# (Render's native Python runtime has neither) and run as a non-root user with
# ENVIRONMENT=production.
#
# Security defaults: ENABLE_TERMINAL and AUTH_DEV_BYPASS are intentionally NOT
# declared here. Do not add AUTH_DEV_BYPASS to any deployed service.

services:
  # Redis for Celery task queue and caching
  # noeviction is required: with allkeys-lru, memory pressure would silently
  # evict queued tasks / broker state / locks. Cache use-cases needing eviction
  # should get a separate Redis instance.
  - type: redis
    name: automaintainer-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from services in this account

  # Backend API (FastAPI) + agent_runs Celery worker
  - type: web
    name: automaintainer-backend
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Launcher baked into the image: starts the agent_runs worker and uvicorn
    # (on $PORT), and exits if either dies so Render restarts the service.
    dockerCommand: automaintainer-api-and-worker
    # Liveness probe only - /healthz/supabase is a readiness/monitoring check
    # and would flap deployments on transient database blips.
    healthCheckPath: /healthz
    autoDeploy: true
    # Must stay at 1: API and worker share this instance's filesystem.
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: CELERY_QUEUES
        value: "agent_runs"
      - key: CELERY_CONCURRENCY
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # GitHub App install flow (POST /github/app/install-url and
      # GET /github/app/setup; docs/DEPLOYMENT.md "Install flow"). Only the
      # API reads these, so the maintenance worker does not declare them.
      # None has a safe default: all are set per deployment in the dashboard.
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      # Bare origin (https://host, no path) the setup callback redirects to.
      - key: DASHBOARD_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: automaintainer-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      # Observability
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      # Supabase connection pooling (use Supabase's built-in pgbouncer)
      - key: SUPABASE_POOLER_URL
        sync: false
      - key: SUPABASE_POOLER_KEY
        sync: false

  # Celery worker for maintenance + GitHub sync, with the embedded beat
  # scheduler (-B). Exactly one instance so periodic tasks are not duplicated.
  # These tasks only use Supabase/GitHub APIs, never repository clones, so
  # this service does not need the backend's filesystem.
  - type: worker
    name: automaintainer-celery-maintenance
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Beat schedule file goes to /tmp: the app directory is read-only for the
    # unprivileged container user.
    dockerCommand: celery -A celery_app worker -Q maintenance,github_sync -l info --concurrency=1 -B -s /tmp/celerybeat-schedule
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: automaintainer-redis
          property: connectionString
      # Observability
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      # Supabase connection pooling
      - key: SUPABASE_POOLER_URL
        sync: false
      - key: SUPABASE_POOLER_KEY
        sync: false

  # Note: Supabase provides built-in connection pooling (pgbouncer) via:
  # - Connection pooling endpoint: `aws-0-region.pooler.supabase.com:6543` (transaction mode)
  # - Session pooler: `aws-0-region.pooler.supabase.com:5432` (session mode)
  #
  # To enable:
  # 1. Go to Supabase Dashboard > Settings > Database > Connection Pooling
  # 2. Enable "Session Pooler" and/or "Transaction Pooler"
  # 3. Add the pooler URL and credentials as SUPABASE_POOLER_URL and SUPABASE_POOLER_KEY
  #
  # The application should use SUPABASE_POOLER_URL for high-concurrency scenarios
  # and fall back to SUPABASE_URL for operations requiring session features.
  #
  # Scaling agent capacity: raise CELERY_CONCURRENCY on the backend service or
  # move to a larger plan. Running agent workers in separate services requires
  # the API to stop depending on the worker's clones (clone on demand, or read
  # via the GitHub API) - tracked in the deployment epic (#418). Per-user IDE
  # views (PR #507) do not change this: they are git worktrees of the clone
  # the agent worker creates, which the API only refreshes from GitHub.
  #
  # Migrating from the previous blueprint: the standalone
  # `automaintainer-celery-worker` service was removed (its job now runs inside
  # automaintainer-backend). Delete it in the Render dashboard if blueprint
  # sync leaves it behind, otherwise it keeps consuming agent_runs on its own
  # unshared filesystem.
