# Backend dependency manifest. uv.lock (next to this file) pins the full
# cross-platform resolution. No requirements.txt is committed; export one on
# demand with scripts/export-backend-requirements.sh if a tool needs it.
# See CONTRIBUTING.md ("Managing backend dependencies").
#
#   uv sync --extra server               # create/update .venv incl. dev group
#   uv add <pkg>                         # add an engine (SDK) dependency
#   uv add --optional server <pkg>       # add a server-only dependency
#   uv add --group dev <pkg>             # add a dev/test dependency
#   uv lock --upgrade-package <pkg>      # upgrade one dependency
#   uv build                             # build the automaintainer wheel
[project]
name = "automaintainer-backend"
# Single source: automaintainer.__version__, read by hatchling at build time.
dynamic = ["version"]
description = "AutoMaintainer engine (Python SDK), with the FastAPI backend and Celery workers behind the server extra."
requires-python = ">=3.11"
# Base install: what `import automaintainer` and AutoMaintainerEngine.run()
# need (the modules under automaintainer/). Everything only main.py, tasks.py,
# celery_app.py, quotas.py or observability.py imports lives in the server
# extra; the deployments install it (`uv sync --extra server`).
dependencies = [
    "langgraph",
    "langchain-groq",
    "pygithub",
    "python-dotenv",
    "pydantic",
    # Capped below 2.0 to match langchain-mcp-adapters (0.3.2 requires
    # mcp<2.0.0). Lift the cap once an adapters release supports mcp 2.x.
    "mcp>=1.24,<2",
    "langchain-mcp-adapters",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "supabase",
    # redis_locks imports redis unguarded and github_app loads it at run time.
    "redis",
    "httpx",
    # GitHub App JWTs (RS256) need pyjwt's cryptography backend.
    "pyjwt",
    "cryptography",
    "pyyaml>=6.0.3",
    # workspace's path validators raise fastapi.HTTPException, which main.py
    # turns into 400s. Decoupling them is a follow-up; fastapi is imported
    # only when the engine runs, never by `import automaintainer`.
    "fastapi",
]

[project.optional-dependencies]
server = [
    "uvicorn",
    "websockets",
    "celery",
    "langchain",
    # Floor prevents the resolver from backtracking to vulnerable litellm 1.83.0 (see #382-#386)
    "litellm>=1.105.1",
    "pywinpty; sys_platform == 'win32'",
    "psycopg2-binary",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-exporter-otlp",
    "opentelemetry-exporter-prometheus",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
]

[tool.uv]
# `uv sync` keeps managing only the dependencies of the app run from this
# directory (main.py, tasks.py and the shims import from the source tree);
# it does not install the project itself. `uv build` still builds the
# automaintainer wheel with the build system below.
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "automaintainer/__init__.py"

[tool.hatch.build.targets.wheel]
# Only the automaintainer package: the engine runtime lives under it, so the
# wheel installs no generic top-level modules. main, tasks, celery_app,
# quotas, observability, the compatibility shims and the tests stay out.
packages = ["automaintainer"]

[tool.hatch.build.targets.sdist]
# Explicit allow-list so a local .env, venv or test fixture never ships.
only-include = ["automaintainer", "pyproject.toml"]
