# Local / prod-like topology: API + Celery worker + Celery beat + Redis.
#
#   create backend/.env (see docs/DEPLOYMENT.md for the variables)
#   docker compose up --build
#   open http://localhost:8000
#
# All app services run the same image. The API and the worker MUST mount the
# same `workspaces` volume at the same path: the worker clones repositories
# there during agent runs and the API's IDE routes (/repo/.../tree, /file,
# /search) and terminal read them back from it.
# See docs/DEPLOYMENT.md for the full environment variable reference.

x-app: &app
  build:
    context: .
    args:
      # Public values baked into the static dashboard bundle.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
  image: automaintainer:local
  init: true # reap zombie children (git, gitnexus, terminal shells)
  restart: unless-stopped
  env_file:
    - path: backend/.env
      required: false
  environment:
    # Values here override backend/.env so the containers always use the
    # in-network Redis and the shared workspace volume.
    REDIS_URL: redis://redis:6379/0
    AUTOMAINTAINER_WORKSPACE_DIR: /var/lib/automaintainer/workspaces
    ENVIRONMENT: ${ENVIRONMENT:-production}
  volumes:
    - workspaces:/var/lib/automaintainer/workspaces
  depends_on:
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "8000:7860"
    # Uses the image CMD (uvicorn) and its HEALTHCHECK on /healthz.

  worker:
    <<: *app
    # Consumes every queue the app routes to. Scale agent capacity with
    # `docker compose up --scale worker=N` (all replicas share the volume).
    command:
      - celery
      - -A
      - celery_app
      - worker
      - -Q
      - agent_runs,maintenance,github_sync,default
      - -l
      - info
      - --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3

  beat:
    <<: *app
    # Exactly one beat instance must run. The schedule file goes to /tmp
    # because the app directory is read-only for the unprivileged user.
    command:
      - celery
      - -A
      - celery_app
      - beat
      - -l
      - info
      - --schedule
      - /tmp/celerybeat-schedule
    # beat never touches repository clones.
    volumes: []
    healthcheck:
      disable: true

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    # noeviction: evicting broker keys would silently drop queued tasks/locks.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Not published to the host: only the app containers need it.

volumes:
  workspaces:
  redis-data:
