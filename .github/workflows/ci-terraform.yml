name: Terraform CI

# Static checks of infra/terraform (#527): formatting and validation.
# No cloud credentials: `init -backend=false` downloads the providers only,
# and nothing here reads or changes the Google Cloud project.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/ci-terraform.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/ci-terraform.yml'

permissions:
  contents: read

env:
  # The version the configuration is validated with (versions.tf needs >= 1.9).
  TERRAFORM_VERSION: "1.17.1"

jobs:
  terraform:
    name: fmt, validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        terraform_wrapper: false

    - name: terraform fmt
      run: terraform fmt -check -recursive

    - name: terraform init (providers only)
      run: terraform init -backend=false -input=false -lockfile=readonly

    - name: terraform validate
      run: terraform validate
