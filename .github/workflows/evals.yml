name: Agent Evals

# Offline Implementer quality evaluation (epic #414, docs/EVALS.md).
# - Pull requests touching the Implementer or the harness: harness unit tests,
#   oracle/no-op baselines and cassette replay. No secrets; the harness makes
#   no network calls in these modes (only pip install does).
# - Manual dispatch: a live run against Groq using the GROQ_API_KEY secret.
# End-to-end evaluation of the whole engine (backend/evals/e2e, docs/EVALS.md):
# - Pull requests: data validation, oracle, no-op and fixture replay, offline.
# - Manual dispatch: live runs against Groq, repeated per task.

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/automaintainer/_runtime/agents.py'
      # Alias file at the pre-#187 path.
      - 'backend/agents.py'
      - 'backend/evals/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      tasks:
        description: "Comma-separated task ids, or 'all'"
        required: false
        default: 'all'
      model:
        description: 'Groq model id'
        required: false
        default: 'llama-3.3-70b-versatile'
      e2e_tasks:
        description: "End-to-end task ids (comma-separated), 'all'"
        required: false
        default: 'all'
      e2e_cases:
        description: "End-to-end Reviewer case ids (comma-separated), 'all'"
        required: false
        default: 'all'
      e2e_repeats:
        description: 'End-to-end repeats per task and case'
        required: false
        default: '3'

permissions:
  contents: read

# Same uv version as ci-backend.yml (keep in step with the Dockerfile).
env:
  UV_VERSION: "0.13.8"
  UV_PYTHON: "3.11"
  UV_PYTHON_DOWNLOADS: never

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Harness, baselines & replay
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./backend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Install dependencies from uv.lock
      run: |
        uv sync --frozen --extra server --group dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    # The end-to-end tests run in the e2e-offline job.
    - name: Harness unit tests
      run: python -m pytest -q -p no:cacheprovider evals --ignore=evals/e2e

    # The oracle must resolve everything and the no-op nothing; anything else
    # means a broken task or a broken harness, not a model result.
    - name: Oracle baseline (must be 100%)
      run: python -m evals.run --mode oracle --jobs 4 --out eval-results/oracle.json --min-resolve-rate 1.0

    - name: No-op baseline (must be 0%)
      run: python -m evals.run --mode noop --jobs 4 --out eval-results/noop.json --max-resolve-rate 0.0

    # The committed cassettes are synthetic: 18 of 30 are correct fixes. A drop
    # means normalize_generated_code or the harness started rejecting or
    # mis-applying output it used to handle. --fail-on-stale: a PR that
    # changes the Implementer prompt must re-bind the cassettes on purpose
    # (python -m evals.rehash) instead of silently replaying old answers.
    - name: Cassette replay
      run: python -m evals.run --mode replay --jobs 4 --out eval-results/replay.json --min-resolve-rate 0.6 --fail-on-stale

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: eval-results-offline
        path: backend/eval-results/
        retention-days: 14

  live:
    name: Live eval (Groq)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./backend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Install dependencies from uv.lock
      run: |
        uv sync --frozen --extra server --group dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Oracle baseline (harness sanity check)
      env:
        EVAL_TASKS: ${{ inputs.tasks }}
      run: python -m evals.run --mode oracle --tasks "$EVAL_TASKS" --jobs 4 --out eval-results/oracle.json --min-resolve-rate 1.0

    # Inputs reach the shell through env vars, never via ${{ }} interpolation
    # inside the script, so they cannot inject commands.
    # Generation and scoring are separate steps (separate processes): the one
    # holding GROQ_API_KEY only calls the model and records cassettes and never
    # runs model-written code, which could read its parent's environment
    # (/proc/<ppid>/environ). Scoring replays the cassettes without the secret.
    - name: Live generation (records cassettes, runs no tests)
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        EVAL_TASKS: ${{ inputs.tasks }}
        EVAL_MODEL: ${{ inputs.model }}
      run: |
        python -m evals.run --mode live --generate-only --tasks "$EVAL_TASKS" \
          --model "$EVAL_MODEL" --record eval-results/cassettes \
          --out eval-results/generation.json

    - name: Score recorded outputs (no secrets)
      env:
        EVAL_TASKS: ${{ inputs.tasks }}
      run: |
        python -m evals.run --mode replay --tasks "$EVAL_TASKS" --fail-on-stale \
          --cassettes eval-results/cassettes --out eval-results/live.json

    - name: Upload results and recorded cassettes
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: eval-results-live
        path: backend/eval-results/
        retention-days: 30

  e2e-offline:
    name: End-to-end (data, oracle, no-op, replay)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./backend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Install dependencies from uv.lock
      run: |
        uv sync --frozen --extra server --group dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    # Data validation (oracle fixes pass and snapshots fail the hidden tests,
    # hidden tests and fixes unreachable through the fake GitHub), fakes,
    # runner, metrics and CLI tests.
    - name: End-to-end data validation and unit tests
      run: python -m pytest -q -p no:cacheprovider evals/e2e

    # The whole engine with scripted agents. The oracle must resolve and get
    # approved everywhere and its Reviewer must be right on every change.
    - name: Oracle (must be 100%)
      run: |
        python -m evals.e2e.run --mode oracle --jobs 4 --out e2e-results/oracle.json \
          --min-resolve-rate 1.0 --min-merged-rate 1.0 \
          --max-false-approval-rate 0 --max-false-rejection-rate 0

    # The no-op resolves nothing; its rubber-stamp Reviewer approves every
    # defective change.
    - name: No-op (must be 0%)
      run: |
        python -m evals.e2e.run --mode noop --jobs 4 --out e2e-results/noop.json \
          --max-resolve-rate 0 --min-false-approval-rate 1.0 --max-false-rejection-rate 0

    # Committed synthetic fixtures with a known score (16/24 resolved, 3/14
    # false approvals). --fail-on-stale: a prompt change must regenerate them
    # on purpose (python -m evals.e2e.make_fixtures).
    - name: Fixture replay
      run: |
        python -m evals.e2e.run --mode replay --jobs 4 --out e2e-results/replay.json \
          --fail-on-stale --min-resolve-rate 0.66 --max-resolve-rate 0.67 \
          --min-false-approval-rate 0.21 --max-false-approval-rate 0.22 \
          --max-false-rejection-rate 0

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-results-offline
        path: backend/e2e-results/
        retention-days: 14

  e2e-live:
    name: End-to-end live (Groq)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./backend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Install dependencies from uv.lock
      run: |
        uv sync --frozen --extra server --group dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Oracle (harness sanity check)
      env:
        EVAL_TASKS: ${{ inputs.e2e_tasks }}
        EVAL_CASES: ${{ inputs.e2e_cases }}
      run: |
        python -m evals.e2e.run --mode oracle --jobs 4 --tasks "$EVAL_TASKS" --cases "$EVAL_CASES" \
          --out e2e-results/oracle.json --min-resolve-rate 1.0 --max-false-approval-rate 0

    # Inputs reach the shell through env vars, never ${{ }} inside the script.
    # Unlike the Implementer-only live job, the engine runs model-written code
    # (verification and hidden tests) in the process that holds the key, so
    # use a dedicated, low-limit evaluation key (docs/EVALS.md, End-to-end).
    - name: Live run (records cassettes)
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        EVAL_TASKS: ${{ inputs.e2e_tasks }}
        EVAL_CASES: ${{ inputs.e2e_cases }}
        EVAL_REPEATS: ${{ inputs.e2e_repeats }}
        EVAL_MODEL: ${{ inputs.model }}
      run: |
        python -m evals.e2e.run --mode live --tasks "$EVAL_TASKS" --cases "$EVAL_CASES" \
          --repeats "$EVAL_REPEATS" --model "$EVAL_MODEL" --jobs 1 \
          --record e2e-results/cassettes --out e2e-results/live.json

    - name: Upload results and recorded cassettes
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-results-live
        path: backend/e2e-results/
        retention-days: 30
