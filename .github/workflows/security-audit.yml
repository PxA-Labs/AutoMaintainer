name: Security & Vulnerability Audit

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'dashboard/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'dashboard/**'

permissions: read-all

jobs:
  python-security:
    name: Python Bandit & Pip-Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Keep in step with UV_VERSION in ci-backend.yml and the Dockerfile.
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install audit tools
        run: |
          pip install bandit pip-audit

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r backend/ -x backend/venv,backend/.venv -s B108 -ll -ii

      - name: Run Pip-Audit Dependency Scan
        # Audit every package pinned in backend/uv.lock (runtime + dev group).
        working-directory: ./backend
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes \
            --format requirements-txt -o "$RUNNER_TEMP/requirements-locked.txt"
          pip-audit -r "$RUNNER_TEMP/requirements-locked.txt"

  node-security:
    name: Node NPM Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.x"

      - name: Run NPM Audit
        working-directory: ./dashboard
        run: |
          npm audit --audit-level=critical
