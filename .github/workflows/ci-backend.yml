name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'scripts/export-backend-requirements.sh'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'scripts/export-backend-requirements.sh'
      - '.github/workflows/**'

# Workflow changes also run this suite: backend/tests/test_workflow_hygiene.py
# statically checks every workflow file.

permissions:
  contents: read

# Backend dependencies are managed with uv: backend/pyproject.toml declares
# them and backend/uv.lock pins them (no requirements.txt is committed).
# Keep UV_VERSION in step with the uv version in the Dockerfile.
env:
  UV_VERSION: "0.13.8"

jobs:
  lint-and-check:
    name: Lint & Style Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./backend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: 'backend/uv.lock'

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Check uv.lock matches pyproject.toml
      run: |
        uv lock --check

    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Check code formatting with Black
      run: |
        black --check .

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./backend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: 'backend/uv.lock'

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Install security scanning tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    - name: Run Bandit AST Security Scan
      run: |
        bandit -r . -x ./venv,./.venv -s B108 -ll -ii

    - name: Run Pip-Audit Dependency Vulnerability Scan
      # Audits every locked package (runtime and dev group), exported from
      # uv.lock, so the scan covers exactly what CI and the image install.
      run: |
        uv export --frozen --all-groups --all-extras --no-emit-project --no-hashes \
          --format requirements-txt -o "$RUNNER_TEMP/requirements-locked.txt"
        pip-audit -r "$RUNNER_TEMP/requirements-locked.txt"

  sdk-wheel:
    # #187: the SDK wheel installs on its own. Builds the sdist and the wheel
    # (from the sdist), installs the wheel into a fresh venv with no extras,
    # and checks that importing the engine loads no server module and that
    # no generic top-level module (events, agents, ...) was installed.
    name: SDK wheel (clean venv import)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    env:
      UV_PYTHON: "3.11"
      UV_PYTHON_DOWNLOADS: never

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Build the sdist and wheel
      run: |
        uv build --out-dir "$RUNNER_TEMP/dist"

    - name: Install the wheel into a fresh venv (no extras)
      run: |
        uv venv "$RUNNER_TEMP/sdk-venv"
        uv pip install --python "$RUNNER_TEMP/sdk-venv/bin/python" "$RUNNER_TEMP"/dist/*.whl

    - name: Import the SDK outside the source tree
      # -I and a cwd outside backend/: only the installed wheel is importable.
      working-directory: ${{ runner.temp }}
      run: |
        "$RUNNER_TEMP/sdk-venv/bin/python" -I - <<'EOF'
        import importlib.util
        import sys

        import automaintainer
        from automaintainer import AutoMaintainerEngine, LocalRunner, SandboxRunner

        loaded = sorted({"fastapi", "main", "celery", "tasks"} & set(sys.modules))
        assert not loaded, f"server modules loaded: {loaded}"
        generic = [
            name
            for name in ("events", "trust", "workspace", "agents", "runners", "github_app")
            if importlib.util.find_spec(name) is not None
        ]
        assert not generic, f"generic top-level modules installed: {generic}"
        assert "site-packages" in automaintainer.__file__, automaintainer.__file__
        print("automaintainer", automaintainer.__version__, "imports cleanly")
        EOF

  test:
    name: Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
        working-directory: ./backend
    env:
      # uv uses the interpreter installed by setup-python for this matrix
      # entry instead of downloading its own.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Install dependencies from uv.lock
      run: |
        uv sync --frozen --extra server --group dev

    - name: Run Tests with pytest and coverage
      run: |
        uv run --frozen pytest -v --cov=. --cov-report=xml:coverage.xml --cov-report=term

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
        path: backend/coverage.xml
        retention-days: 14

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
