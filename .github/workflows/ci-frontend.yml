name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'dashboard/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'dashboard/**'
      - '.github/workflows/ci-frontend.yml'

permissions: read-all

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./dashboard

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './dashboard/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Linter
      run: npm run lint
      
    - name: Build Next.js App
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_key"
      run: npm run build

  e2e:
    # Playwright smoke tests against the static export, with the backend and
    # Supabase mocked in the browser (dashboard/e2e). No secrets needed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./dashboard

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js 22.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './dashboard/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Resolve Playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    # Browser binaries are keyed on the exact Playwright version, so a
    # version bump downloads matching browsers instead of reusing stale ones.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

    - name: Install Playwright Chromium and system dependencies
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    # OS packages are not in the cache; install them on a cache hit too.
    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Run e2e smoke tests
      run: npm run test:e2e

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report
        path: |
          dashboard/playwright-report/
          dashboard/test-results/
        retention-days: 14
