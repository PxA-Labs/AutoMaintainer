name: "Auto Update Changelog"

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to sync into CHANGELOG.md (e.g. 177)'
        required: false
        type: string
        default: ''
      force:
        description: 'Force add even if duplicate'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog-pr:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Sync Changelog Entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_PR_BODY: ${{ github.event.pull_request.body }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import subprocess
          from scripts.changelog_manager import parse_conventional_pr, add_entry_to_changelog, update_compare_links

          pr_num = os.environ.get("EVENT_PR_NUMBER") or os.environ.get("INPUT_PR_NUMBER")
          pr_title = os.environ.get("EVENT_PR_TITLE") or ""
          pr_url = os.environ.get("EVENT_PR_URL") or ""
          pr_author = os.environ.get("EVENT_PR_AUTHOR") or ""
          pr_body = os.environ.get("EVENT_PR_BODY") or ""
          force = os.environ.get("INPUT_FORCE", "").lower() == "true"

          if not pr_num or not pr_title:
              target = pr_num if pr_num else ""
              if target:
                  cmd = ["gh", "pr", "view", str(target), "--json", "number,title,url,author,body"]
              else:
                  cmd = ["gh", "pr", "list", "--state", "merged", "--limit", "1", "--json", "number,title,url,author,body"]
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode == 0 and res.stdout.strip():
                  data = json.loads(res.stdout.strip())
                  if isinstance(data, list) and len(data) > 0:
                      data = data[0]
                  if isinstance(data, dict):
                      pr_num = str(data.get("number", ""))
                      pr_title = data.get("title", "")
                      pr_url = data.get("url", "")
                      pr_author = data.get("author", {}).get("login", "")
                      pr_body = data.get("body", "") or ""

          if not pr_num or not pr_title:
              print("No merged PR found to process.")
              sys.exit(0)

          category, entry, is_breaking = parse_conventional_pr(
              title=pr_title,
              number=pr_num,
              url=pr_url,
              author=pr_author,
              body=pr_body,
          )

          changed = add_entry_to_changelog(
              changelog_path="CHANGELOG.md",
              category=category,
              entry=entry,
              pr_number=pr_num,
              force=force,
          )

          if changed:
              update_compare_links("CHANGELOG.md")
              print(f"Successfully added PR #{pr_num} to category '{category}'.")
          else:
              print(f"PR #{pr_num} already in CHANGELOG.md.")

          if "GITHUB_ENV" in os.environ:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"SYNC_PR_NUM={pr_num}\nSYNC_PR_TITLE={pr_title}\n")
          EOF

      - name: Synchronize Persistent Living Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog updates needed."
            exit 0
          fi

          BRANCH_NAME="chore/changelog-sync"
          
          # Fetch existing sync branch if present
          git fetch origin "${BRANCH_NAME}:${BRANCH_NAME}" || true
          git checkout -B "${BRANCH_NAME}"
          
          git add CHANGELOG.md
          git commit -m "docs(changelog): update CHANGELOG.md [skip ci]"
          git push -u origin "${BRANCH_NAME}" --force
          
          EXISTING_PR=$(gh pr list --head "${BRANCH_NAME}" --json number --jq '.[0].number')
          
          cat << EOF > pr_body.md
          ### 📋 Automated Changelog & Release Synchronization

          This pull request was automatically generated by the [Auto Update Changelog](https://github.com/PxA-Labs/AutoMaintainer/actions/workflows/auto-changelog.yml) workflow to keep \`CHANGELOG.md\` synchronized with newly merged Pull Requests.

          #### 📦 Latest Change Processed:
          - **PR:** #${SYNC_PR_NUM} (${SYNC_PR_TITLE})

          ---
          *When maintainers are ready to cut a new release, merge this pull request into \`main\` and push the corresponding version tag.*
          EOF

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #${EXISTING_PR}..."
            gh pr edit "${EXISTING_PR}" --title "chore(changelog): synchronize changelog for unreleased changes" --body-file pr_body.md
          else
            echo "Creating new living Release PR..."
            gh pr create \
              --title "chore(changelog): synchronize changelog for unreleased changes" \
              --body-file pr_body.md \
              --head "${BRANCH_NAME}" \
              --base "main"
          fi
