name: Auto Update Changelog

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to sync into CHANGELOG.md (e.g. 166)'
        required: false
        default: '166'
      force:
        description: 'Force create PR test'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog-pr:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Update CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import re
          import json
          import subprocess

          pr_number = os.environ.get("PR_NUMBER", "").strip()
          pr_title = os.environ.get("PR_TITLE", "").strip()
          pr_url = os.environ.get("PR_URL", "").strip()
          pr_author = os.environ.get("PR_AUTHOR", "").strip()
          input_pr = os.environ.get("INPUT_PR_NUMBER", "").strip()
          input_force = os.environ.get("INPUT_FORCE", "").lower() == "true"

          if not pr_number or not pr_title:
              target_pr = input_pr if input_pr else ""
              if target_pr:
                  res = subprocess.run(["gh", "pr", "view", target_pr, "--json", "number,title,url,author"], capture_output=True, text=True)
              else:
                  res = subprocess.run(["gh", "pr", "list", "--state", "merged", "--limit", "1", "--json", "number,title,url,author"], capture_output=True, text=True)
              
              if res.returncode == 0 and res.stdout.strip():
                  data = json.loads(res.stdout.strip())
                  if isinstance(data, list) and len(data) > 0:
                      data = data[0]
                  if isinstance(data, dict):
                      pr_number = str(data.get("number", ""))
                      pr_title = data.get("title", "")
                      pr_url = data.get("url", "")
                      pr_author = data.get("author", {}).get("login", "")

          if not pr_number or not pr_title:
              print("No PR information found, skipping.")
              sys.exit(0)

          if pr_author == "app/dependabot":
              pr_author = "dependabot[bot]"

          # Classify category to match CHANGELOG.md exact sections (no emojis)
          t = pr_title.lower()
          if t.startswith("docs") or "readme" in t or "contributing" in t or "guide" in t or "pitch" in t or "frontmatter" in t:
              category = "Documentation & Blueprints"
          elif "openssf" in t or "scorecard" in t or "gitleaks" in t or "bandit" in t or "pip-audit" in t or "vulnerability" in t or "security" in t:
              category = "Security & Governance"
          elif "bump actions" in t or "bump docker" in t or "bump github" in t or "bump ossf" in t or "bump release-drafter" in t or "bump pascalgn" in t:
              category = "CI/CD, Infrastructure & Deployment"
          elif "bump" in t or "chore(deps" in t:
              category = "Dependency Updates & Maintenance"
          elif "monaco" in t or "xterm" in t or "terminal" in t or "gitnexus" in t:
              category = "Web IDE & Developer Experience"
          elif t.startswith("fix") or "resolve" in t or "reset" in t or "prevent" in t or "collision" in t or "duplicate" in t or "leakage" in t:
              category = "Bug Fixes & System Stability"
          elif "deploy" in t or "docker" in t or "vercel" in t or "render" in t or "workflow" in t or "action" in t or "ci" in t:
              category = "CI/CD, Infrastructure & Deployment"
          elif t.startswith("feat") or "agent" in t or "langgraph" in t or "supabase" in t or "realtime" in t:
              category = "Architecture & Core Agent Platform"
          else:
              category = "Architecture & Core Agent Platform"

          entry = f"- {pr_title} ([#{pr_number}]({pr_url})) - @{pr_author}"

          changelog_path = "CHANGELOG.md"
          if not os.path.exists(changelog_path):
              content = "# Changelog\n\nAll notable changes to the AutoMaintainer autonomous AI software engineering platform will be documented in this file.\n\n## [Unreleased]\n\n"
          else:
              with open(changelog_path, "r", encoding="utf-8") as f:
                  content = f.read()

          if "## [Unreleased]" not in content:
              lines = content.splitlines()
              new_lines = []
              inserted = False
              for line in lines:
                  new_lines.append(line)
                  if line.startswith("# ") and not inserted:
                      new_lines.append("")
                      new_lines.append("## [Unreleased]")
                      inserted = True
              content = "\n".join(new_lines) + "\n"

          # Split around ## [Unreleased]
          parts = content.split("## [Unreleased]", 1)
          header = parts[0] + "## [Unreleased]\n"
          rest = parts[1]

          # Find next release heading (e.g. ## [0.9.0] or ## [1.0.0])
          next_heading = re.search(r"\n##\s+\[?[0-9v]", rest)
          if next_heading:
              unreleased_section = rest[:next_heading.start()]
              rest_section = rest[next_heading.start():]
          else:
              unreleased_section = rest
              rest_section = ""

          # Avoid duplicate entry unless forced
          if f"[#{pr_number}]" in unreleased_section and not input_force:
              print(f"PR #{pr_number} already in CHANGELOG.md.")
              # Export to GITHUB_ENV anyway
              if "GITHUB_ENV" in os.environ:
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                      env_file.write(f"SYNC_PR_NUMBER={pr_number}\nSYNC_PR_TITLE={pr_title}\n")
              sys.exit(0)

          cat_header = f"### {category}"
          if cat_header in unreleased_section:
              cat_parts = unreleased_section.split(cat_header, 1)
              unreleased_section = cat_parts[0] + cat_header + "\n\n" + entry + "\n" + cat_parts[1].lstrip("\n")
          else:
              unreleased_section = "\n### " + category + "\n\n" + entry + "\n" + unreleased_section.lstrip("\n")

          new_changelog = (header + "\n" + unreleased_section.strip() + "\n\n" + rest_section.strip()).strip() + "\n"

          with open(changelog_path, "w", encoding="utf-8") as f:
              f.write(new_changelog)

          if "GITHUB_ENV" in os.environ:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"SYNC_PR_NUMBER={pr_number}\nSYNC_PR_TITLE={pr_title}\n")

          print(f"Successfully processed PR #{pr_number} ({pr_title}) for {category} in CHANGELOG.md")
          EOF

      - name: Create branch, commit, and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --quiet CHANGELOG.md; then
            echo "No changes detected in CHANGELOG.md, skipping PR creation."
            exit 0
          fi

          BRANCH_NAME="chore/update-changelog-pr-${SYNC_PR_NUMBER}"
          
          git checkout -b "${BRANCH_NAME}"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update CHANGELOG.md for PR #${SYNC_PR_NUMBER}"
          git push -u origin "${BRANCH_NAME}" --force
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "${BRANCH_NAME}" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request #${EXISTING_PR} already exists for branch ${BRANCH_NAME}."
          else
            gh pr create \
              --title "docs(changelog): update CHANGELOG.md for PR #${SYNC_PR_NUMBER}" \
              --body "Automated changelog update following the merge of PR #${SYNC_PR_NUMBER} (${SYNC_PR_TITLE})." \
              --head "${BRANCH_NAME}" \
              --base "main"
            echo "Pull request created successfully."
          fi
