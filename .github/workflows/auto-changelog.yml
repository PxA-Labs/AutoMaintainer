name: Auto Update Changelog

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Update CHANGELOG.md
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import re

          pr_number = os.environ.get("PR_NUMBER", "")
          pr_title = os.environ.get("PR_TITLE", "").strip()
          pr_url = os.environ.get("PR_URL", "")
          pr_author = os.environ.get("PR_AUTHOR", "")

          if not pr_number or not pr_title:
              print("Missing PR information, skipping.")
              sys.exit(0)

          # Classify category
          title_lower = pr_title.lower()
          if title_lower.startswith("feat"):
              category = "Added"
          elif title_lower.startswith("fix"):
              category = "Fixed"
          elif title_lower.startswith("docs"):
              category = "Documentation"
          elif title_lower.startswith("security"):
              category = "Security"
          elif title_lower.startswith("refactor"):
              category = "Changed"
          elif title_lower.startswith("test"):
              category = "Tests"
          else:
              category = "Maintenance"

          entry = f"- {pr_title} ([#{pr_number}]({pr_url})) - @{pr_author}"

          changelog_path = "CHANGELOG.md"
          if not os.path.exists(changelog_path):
              content = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n## [Unreleased]\n\n"
          else:
              with open(changelog_path, "r", encoding="utf-8") as f:
                  content = f.read()

          if "## [Unreleased]" not in content:
              lines = content.splitlines()
              new_lines = []
              inserted = False
              for line in lines:
                  new_lines.append(line)
                  if line.startswith("# ") and not inserted:
                      new_lines.append("")
                      new_lines.append("## [Unreleased]")
                      inserted = True
              content = "\n".join(new_lines) + "\n"

          # Split around ## [Unreleased]
          parts = content.split("## [Unreleased]", 1)
          header = parts[0] + "## [Unreleased]\n"
          rest = parts[1]

          # Find next release heading (e.g. ## [0.9.0])
          next_heading = re.search(r"\n##\s+\[?[0-9v]", rest)
          if next_heading:
              unreleased_section = rest[:next_heading.start()]
              rest_section = rest[next_heading.start():]
          else:
              unreleased_section = rest
              rest_section = ""

          # Avoid duplicate entry
          if f"[#{pr_number}]" in unreleased_section:
              print(f"PR #{pr_number} already in CHANGELOG.md.")
              sys.exit(0)

          cat_header = f"### {category}"
          if cat_header in unreleased_section:
              cat_parts = unreleased_section.split(cat_header, 1)
              unreleased_section = cat_parts[0] + cat_header + "\n" + entry + "\n" + cat_parts[1].lstrip("\n")
          else:
              unreleased_section = "\n" + cat_header + "\n" + entry + "\n" + unreleased_section.lstrip("\n")

          new_changelog = (header + unreleased_section + rest_section).strip() + "\n"

          with open(changelog_path, "w", encoding="utf-8") as f:
              f.write(new_changelog)

          print(f"Successfully added PR #{pr_number} to {category} in CHANGELOG.md")
          EOF

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add CHANGELOG.md
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update CHANGELOG.md with PR #${{ github.event.pull_request.number }} [skip ci]"
            git push
            echo "Changelog updated and pushed successfully"
          fi
