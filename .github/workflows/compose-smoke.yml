name: Compose smoke test

# End-to-end check of the docker compose topology (#396): builds the image,
# starts api + worker + beat + redis, waits for /healthz, confirms /start finds
# a Celery worker, and drives one run to a terminal state. No secrets are used:
# the stack talks to an in-memory fake of Supabase's REST API and the run is
# expected to fail at its first GitHub step for lack of credentials. See
# scripts/compose-smoke.sh and docs/DEPLOYMENT.md ("Smoke test").

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'backend/**'
      - 'scripts/compose-smoke.sh'
      - 'scripts/compose-smoke/**'
      - '.github/workflows/compose-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: docker compose up (queued -> terminal)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built here rather than by `docker compose build` so the layers come
      # from the GitHub Actions cache shared with docker-publish.yml. Loaded
      # into the local daemon under the tag docker-compose.yml uses.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: automaintainer:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the smoke test
        env:
          COMPOSE_SMOKE_SKIP_BUILD: '1'
        run: bash scripts/compose-smoke.sh
