version: 2
updates:
  # Python dependencies (backend). The "uv" ecosystem updates
  # backend/pyproject.toml and backend/uv.lock with uv itself, keeping the
  # universal (cross-platform) resolution, so its PRs are complete as-is.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "purvanshjoshi"
    labels:
      - "dependencies"
      - "python"

  # JavaScript dependencies (dashboard)
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "purvanshjoshi"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # next and eslint-config-next are pinned to the same exact version.
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      # tailwindcss core and its PostCSS plugin must stay on the same version.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "purvanshjoshi"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # All github/codeql-action/* steps must run the same version or
      # CodeQL refuses to analyze; bump them together in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "purvanshjoshi"
    labels:
      - "dependencies"
      - "docker"
